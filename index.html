<script>
const metadata=JSON.parse(document.getElementById('items').textContent);
let items=[];
const style=document.getElementById('style'),styleNames={apple:'苹果风格',google:'谷歌风格',flat:'扁平化',skeuo:'拟物风格',soft:'轻拟物','3d':'3D 风格',pixel:'像素风格'};
const shape=document.getElementById('shape'),shapeNames={rectangle:'圆角矩形',square:'圆角方形',circle:'圆形'};
const requested=new URLSearchParams(location.search).get('shape');if(Object.hasOwn(shapeNames,requested))shape.value=requested;
function artwork(item){return item.variants.find(v=>v.shape===shape.value&&v.form==='icon')}

const categoryNames={"video":"影视视频","live":"直播应用","entertainment":"综合娱乐","audio":"音乐音频","cloud":"网盘存储","casting":"投屏互联","tools":"系统工具","games":"游戏娱乐","fitness":"运动健康","other":"其他应用"};
const gallery=document.getElementById('gallery'),search=document.getElementById('search'),category=document.getElementById('category'),viewer=document.getElementById('viewer');
function show(item){const variant=artwork(item);document.getElementById('viewer-title').textContent=item.name+'  '+styleNames[item.style]+'  '+shapeNames[shape.value];const image=document.getElementById('viewer-image');image.src=variant.image.path;image.alt=item.name;image.style.maxWidth=variant.image.width+'px';document.getElementById('viewer-note').textContent=item.note||'独立设计稿';const links=document.getElementById('viewer-links');links.replaceChildren();for(const [url,label] of [[variant.image.path,'下载图标'],[item.sourcePage,'来源页面'],[item.reference,'参考正式图']]){if(!url)continue;const a=document.createElement('a');a.href=url;if(url===variant.image.path)a.download=item.id+'-'+item.style+'-'+shape.value+'.png';else{a.target='_blank';a.rel='noreferrer'}a.textContent=label;a.style.marginRight='18px';links.append(a)}viewer.showModal()}
function render(){const styled=items.filter(i=>i.style===style.value);document.getElementById('sizes').textContent=styleNames[style.value]+'  '+styled.length+' 款  3 种形状  '+(shape.value==='rectangle'?'正式图 720×405  缩略图 320×180':'正式图 512×512  缩略图 256×256');const query=search.value.trim().toLocaleLowerCase(),visible=styled.filter(i=>(!query||i.name.toLocaleLowerCase().includes(query)||i.id.includes(query))&&(!category.value||i.category===category.value));document.getElementById('count').textContent=visible.length+' / '+styled.length;gallery.replaceChildren();for(const [value,label] of Object.entries(categoryNames)){const group=visible.filter(i=>i.category===value);if(!group.length)continue;const section=document.createElement('section'),heading=document.createElement('div');heading.className='category-heading';const h=document.createElement('h2');h.textContent=label;const count=document.createElement('span');count.textContent=group.length+' 项';heading.append(h,count);const grid=document.createElement('div');grid.className='grid';for(const item of group){const variant=artwork(item);if(!variant)continue;const figure=document.createElement('figure');figure.className='tile';const button=document.createElement('button');button.className='art';button.setAttribute('aria-label','查看'+item.name);button.onclick=()=>show(item);const image=document.createElement('img');image.src=variant.thumbnail.path;image.className=shape.value==='rectangle'?'':'compact';image.alt=item.name;image.loading='lazy';image.width=variant.thumbnail.width;image.height=variant.thumbnail.height;image.decoding='async';button.append(image);const caption=document.createElement('figcaption');caption.className='caption';const title=document.createElement('div'),name=document.createElement('span');name.className='name';name.textContent=item.name;title.append(name);caption.append(title);figure.append(button,caption);grid.append(figure)}section.append(heading,grid);gallery.append(section)}if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent='没有匹配的图标';gallery.append(p)}}
function updateUrl(){const url=new URL(location.href);url.searchParams.set('style',style.value);url.searchParams.set('shape',shape.value);if(category.value)url.searchParams.set('category',category.value);else url.searchParams.delete('category');url.searchParams.delete('batch');url.searchParams.delete('identity');history.replaceState(null,'',url)}
search.addEventListener('input',render);for(const control of [style,shape,category])control.addEventListener('change',()=>{if(viewer.open)viewer.close();updateUrl();render()});
document.getElementById('theme').onclick=()=>{const light=document.body.classList.toggle('light');document.getElementById('theme').textContent=light?'切换深色背景':'切换浅色背景'};
document.getElementById('close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
async function loadCatalog(){try{const response=await fetch('catalog.json',{cache:'no-store'});if(!response.ok)throw Error('目录加载失败');const catalog=await response.json();const byId=new Map(metadata.map(i=>[i.id,i]));items=catalog.items.map(i=>({...byId.get(i.id),...i,category:byId.get(i.id)?.category||'other'}));category.replaceChildren(new Option('全部类别',''),...Object.entries(categoryNames).filter(([value])=>items.some(i=>i.category===value)).map(([value,label])=>new Option(label,value)));const requestedCategory=new URLSearchParams(location.search).get('category');if(Object.hasOwn(categoryNames,requestedCategory))category.value=requestedCategory;const styles=[...new Set(items.map(i=>i.style))];style.replaceChildren(...styles.map(value=>new Option(styleNames[value],value)));const requestedStyle=new URLSearchParams(location.search).get('style');if(styles.includes(requestedStyle))style.value=requestedStyle;updateUrl();render()}catch(error){gallery.textContent='图标目录暂时无法加载，请稍后刷新。';document.getElementById('count').textContent='加载失败'}}
loadCatalog();
</script></html>
